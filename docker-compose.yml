services:
  api:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    env_file: .env
    command: npm run dev
    # Pas de "depends_on: db" ici : en usage normal, l'API se connecte
    # à la base distante (Aiven) via les variables du .env (DB_HOST,
    # DATABASE_URL, etc.), pas au service "db" local.

  # Base de données LOCALE, optionnelle — utile uniquement pour tester
  # sans toucher à la base Aiven de production. Inactive par défaut.
  # Pour la lancer : docker compose --profile local-db up
  db:
    #profiles: ["local-db"]
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./src/db/script.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db_data: