name: Docker CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  run-tests:
    name: Build, Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # DB_NAME aligné sur celui codé en dur dans script.sql (GlobeTrotterAPP_DB)
      - name: Create test .env
        run: |
          cat <<EOF > .env
          DB_HOST=db
          DB_PORT=3306
          DB_ROOT_PASSWORD=root_test_pass
          DB_NAME=GlobeTrotterAPP_DB
          DB_USER=test_user
          DB_PASSWORD=test_pass
          PEXELS_API_KEY=mock_key
          JWT_SECRET=test_secret_key_for_ci
          EOF

      - name: Verify Docker installation
        run: |
          docker --version
          docker compose version

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint (Static Analysis)
        run: npm run lint

      # 🧪 ÉTAPE 1 : Tests unitaires (S'exécutent directement en local sur le code brut sans Docker)
      - name: Run Unit Tests
        run: npm run test:unit

      # ⚙️ ÉTAPE 2 : Préparation de l'environnement pour l'intégration
      - name: Build and start Docker containers
        run: docker compose up -d --build

      # Attend que MySQL accepte réellement les connexions
      - name: Wait for MySQL
        run: |
          set -a
          source .env
          set +a
          timeout 180 bash -c '
            until docker compose exec -T db \
              mysql -u"$DB_USER" -p"$DB_PASSWORD" "$DB_NAME" \
              -e "SELECT 1;" >/dev/null 2>&1
            do
              echo "En attente de MySQL..."
              sleep 2
            done
          '

      # Applique le schéma (tables users, sites, ratings...) sur la base fraîchement créée.
      # Utilise le compte root car script.sql fait DROP/CREATE DATABASE,
      # une opération que le user applicatif (test_user) n'a pas le droit de faire.
      - name: Apply database schema
        run: |
          set -a
          source .env
          set +a
          docker compose exec -T db mysql -uroot -p"$DB_ROOT_PASSWORD" < ./src/db/script.sql

      # Attend que l'API réponde sur la route /health.
      - name: Wait for API
        run: |
          timeout 180 bash -c '
            until curl -fs http://localhost:3000/health >/dev/null
            do
              echo "En attente de l'\''API..."
              sleep 3
            done
          '

      - name: Show running containers
        run: docker compose ps

      # 🧪 ÉTAPE 3 : Tests d'intégration (S'exécutent à l'intérieur du conteneur lié à la BDD)
      - name: Run Integration Tests
        run: docker compose exec -T api npm run test:integration

      - name: Display container logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop and remove containers
        if: always()
        run: docker compose down -v

  deploy:
    name: Deploy to Render
    needs: [run-tests, security-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger deployment
        run: curl -fsS "${{ secrets.RENDER_DEPLOY_HOOK }}"
