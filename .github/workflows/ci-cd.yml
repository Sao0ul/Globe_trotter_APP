name: Docker CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  run-tests:
    name: Build, Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create test .env
        run: |
          cat <<EOF > .env
          DB_HOST=db
          DB_PORT=5432
          DB_NAME=GlobeTrotterAPP_DB
          DB_USER=test_user
          DB_PASSWORD=test_pass
          PEXELS_API_KEY=mock_key
          JWT_SECRET=test_secret_key_for_ci
          EOF

      - name: Verify Docker installation
        run: |
          docker --version
          docker compose version

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm #save time by putting node_modules in cache

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint (Static Analysis)
        run: npm run lint

      # ==========================================================
      # 🧪 ÉTAPE 1 — TESTS UNITAIRES
      # S'exécutent directement sur le code brut, sans Docker,
      # sans base de données : rapides, isolés, aucune dépendance externe.
      # ==========================================================
      - name: "🧪 Run Unit Tests"
        run: npm run test:unit

      # ==========================================================
      # ⚙️ PRÉPARATION DE L'ENVIRONNEMENT D'INTÉGRATION
      # ==========================================================

      # On démarre uniquement le service "db" ici, puis on attend sa santé
      # avant d'appliquer le schéma et de lancer l'API. Évite une race
      # condition au boot de la stack pendant l'initialisation de PostgreSQL.
      - name: Build and start database container
        run: docker compose up -d --build db

      # Attend que PostgreSQL accepte réellement les connexions.
      - name: Wait for PostgreSQL
        run: |
          set -a #make sure env vars are exported for docker compose exec
          source .env #read env vars from .env file
          set +a #desactivate export of env vars 
          timeout 180 bash -c '
            until docker compose exec -T db \
              psql -U "$DB_USER" -d "$DB_NAME" -c "SELECT 1;" >/dev/null 2>&1
            do
              echo "En attente de PostgreSQL..."
              sleep 2
            done
          '

      # Applique le schéma (tables users, sites, ratings...) sur la base
      # fraîchement créée par le conteneur — sans ça, l'API et les tests
      # d'intégration échoueront dès la première requête (table inexistante).
      - name: Apply database schema
        run: |
          set -a #make sure env vars are exported for docker compose exec
          source .env
          set +a
          docker compose exec -T db psql -U "$DB_USER" -d "$DB_NAME" < ./src/db/script.sql

      # L'API est démarrée seulement maintenant, une fois le schéma en
      # place : elle peut ouvrir ses connexions au pool en sachant que
      # les tables existent déjà.
      - name: Build and start API container
        run: docker compose up -d --build api

      # Attend que l'API réponde sur sa route de health check (/health,
      # définie dans src/app.js).
      - name: Wait for API
        run: |
          timeout 180 bash -c '
            until curl -fs http://localhost:3000/health >/dev/null
            do
              echo "En attente de l'\''API..."
              sleep 3
            done
          '

      - name: Show running containers
        run: docker compose ps

      # ==========================================================
      # 🧪 ÉTAPE 2 — TESTS D'INTÉGRATION
      # S'exécutent à l'intérieur du conteneur "api", avec un accès réel
      # à la base PostgreSQL déjà peuplée du schéma appliqué plus haut.
      # ==========================================================
      - name: "🧪 Run Integration Tests"
        run: docker compose exec -T api npm run test:integration

      - name: Display container logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop and remove containers
        if: always()
        run: docker compose down -v

  deploy:
    name: Deploy to Render
    needs: [run-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger deployment
        run: curl -fsS "${{ secrets.RENDER_DEPLOY_HOOK }}"