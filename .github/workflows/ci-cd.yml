name: Docker CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  run-tests:
    name: Build, Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Créé en premier afin que le fichier existe même si une étape échoue.
      - name: Create test .env
        run: |
          cat <<EOF > .env
          DB_HOST=db
          DB_PORT=3306
          DB_ROOT_PASSWORD=root_test_pass
          DB_NAME=my_database
          DB_USER=test_user
          DB_PASSWORD=test_pass
          PEXELS_API_KEY=mock_key
          JWT_SECRET=test_secret_key_for_ci
          EOF
      - name: Verify Docker installation
        run: |
          docker --version
          docker compose version

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build and start Docker containers
        run: docker compose up -d --build

      # Attend que MySQL accepte réellement les connexions
      # (plus fiable qu'un simple mysqladmin ping).
      # set -a / source .env / set +a : charge et exporte les variables du
      # fichier .env généré plus haut, pour que le sous-shell bash -c en hérite.
      - name: Wait for MySQL
        run: |
          set -a
          source .env
          set +a
          timeout 180 bash -c '
            until docker compose exec -T db \
              mysql -u"$DB_USER" -p"$DB_PASSWORD" "$DB_NAME" \
              -e "SELECT 1;" >/dev/null 2>&1
            do
              echo "En attente de MySQL..."
              sleep 2
            done
          '

      # Attend que l'API réponde sur la route /health.
      - name: Wait for API
        run: |
          timeout 180 bash -c '
            until curl -fs http://localhost:3000/health >/dev/null
            do
              echo "En attente de l\'\''API..."
              sleep 3
            done
          '

      - name: Show running containers
        run: docker compose ps

      - name: Run unit tests
        run: docker compose exec -T api npm test

      - name: Display container logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop and remove containers
        if: always()
        run: docker compose down -v

  deploy:
    name: Deploy to Render
    needs: run-tests
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger backend deployment
        run: curl -fsS "${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}"

      - name: Trigger frontend deployment
        run: curl -fsS "${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}"