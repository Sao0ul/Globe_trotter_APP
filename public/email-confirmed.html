<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="assets/images/logoLogin.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DicoverCameroon-confirm-account</title>
    <link rel="stylesheet" href="css/site.css">
    <style>
        .confirm-shell {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .confirm-card {
            background: #fff;
            border-radius: 18px;
            padding: 40px 32px;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 14px 40px rgba(22, 51, 43, 0.14);
        }

        .confirm-icon {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
        }

        .confirm-icon.success {
            background: rgba(34, 197, 94, 0.12);
            color: #22c55e;
        }

        .confirm-icon.error {
            background: rgba(239, 68, 68, 0.12);
            color: #ef4444;
        }

        .confirm-card h1 {
            font-size: 20px;
            margin-bottom: 10px;
            color: var(--ink, #16332b);
        }

        .confirm-card p {
            color: var(--ink-soft, #6b7d78);
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .confirm-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .confirm-actions a {
            padding: 11px 22px;
            border-radius: 999px;
            font-size: 13.5px;
            font-weight: 600;
            text-decoration: none;
        }

        .btn-login {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: #fff;
        }

        .btn-back {
            background: rgba(22, 51, 43, 0.06);
            color: var(--ink, #16332b);
        }
    </style>
</head>

<body>
    <div class="confirm-shell">
        <div class="confirm-card">
            <div id="confirmIcon" class="confirm-icon"></div>
            <h1 id="confirmTitle"></h1>
            <p id="confirmText"></p>
            <div class="confirm-actions">
                <a href="index.html" class="btn-back">Back</a>
                <a href="index.html" id="loginBtn" class="btn-login">Login</a>
            </div>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const status = params.get('status');

        const icon = document.getElementById('confirmIcon');
        const title = document.getElementById('confirmTitle');
        const text = document.getElementById('confirmText');

        if (status === 'success') {
            icon.classList.add('success');
            icon.innerHTML = '✓';
            title.textContent = 'Compte confirmé';
            text.textContent = 'Your account is now ready! You can setart right now.';
        } else {
            icon.classList.add('error');
            icon.innerHTML = '✕';
            title.textContent = 'Lien invalide ou expiré';
            text.textContent = "This confirm link is not valid anymore. Please try to register again.";
        }
    </script>
</body>

</html>
