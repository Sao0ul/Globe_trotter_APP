<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="assets/images/logoLogin.png" />
    <title data-i18n="verify.title">Discover Cameroon — Confirmation</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="video-overlay"></div>

    <div id="languageSwitcher" class="language-switcher">
        <button type="button" class="lang-pill" data-lang="fr">FR</button>
        <button type="button" class="lang-pill" data-lang="en">EN</button>
    </div>

    <main class="login-container">
        <div class="login-card" style="text-align: center;">

            <div class="logo">
                <div class="logo-circle">
                    <img src="./assets/images/logoLogin.png" alt="Discover Cameroon">
                </div>
                <h1 data-i18n="verify.title">Confirmation de compte</h1>
            </div>

            <!-- État "en cours" pendant l'appel à l'API -->
            <div id="loadingState">
                <p data-i18n="verify.loading">Vérification en cours...</p>
            </div>

            <!-- État succès -->
            <div id="successMessage" class="success-message" hidden></div>

            <!-- État erreur -->
            <div id="errorMessage" class="error-message" hidden></div>

        </div>
    </main>

    <script src="js/i18n.js"></script>
    <script src="js/verify.js"></script>

</body>

</html>
