<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site détail</title>
    <link rel="icon" type="image/png" href="assets/images/logoLogin.png">
    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Work+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <!-- CSS -->
    <link rel="stylesheet" href="css/site-detail.css">
    <link rel="stylesheet" href="css/site-detail-title.css">
    <link rel="stylesheet" href="css/map-markers.css">
</head>


<body class="page-shell">
    <header class="wp-header">

        <!-- Bouton retour -->
        <a class="wp-header__back" href="sites.html" aria-label="Back">
            <span class="wp-header__back-icon" aria-hidden="true"></span>
        </a>

        <!-- Identité du site -->
        <div class="wp-header__identity">
            <h1 class="wp-header__title" id="siteTitle">Loading...</h1>
            <p class="wp-header__eyebrow" id="siteDistance">—</p>
        </div>

        <!-- Actions -->
        <div class="wp-header__actions">

            <button class="wp-header__map" id="openItineraryBtn" type="button">
                <span class="wp-header__map-label">View on map</span>
                <span class="wp-header__pin" aria-hidden="true">
                    <span class="wp-header__pin-mark"></span>
                </span>
            </button>

            <button class="wp-header__like" id="btn-likes" type="button" aria-label="Add to favorites">🤍</button>

        </div>

    </header>

    <main>

        <!-- =====================================================
             VIDÉO + HEADER SUPERPOSÉ
             ===================================================== -->

        <section class="detail-hero">

            <!-- =================================================
                 CADRE VIDÉO
                 ================================================= -->
            <div class="detail-video-area">
                <div class="detail-video">
                    <!-- Vidéo principale -->
                    <video id="siteVideo" controls poster="">
                        <source id="videoSource" src="" type="video/mp4">
                        Votre navigateur ne supporte pas la vidéo.
                    </video>
                    <!-- Conteneur vidéo alternatif -->
                    <div id="videoContainer" class="video-container" aria-hidden="true"></div>
                    <!-- Overlay + bouton Play -->
                    <div id="videoOverlay" class="video-overlay" aria-hidden="true">
                        <button id="playPreviewBtn" class="btn-ghost" type="button">
                            ▶ Start video
                        </button>
                    </div>
                </div>
                <!-- =================================================
                    SOURCE VIDÉO
                ================================================= -->
                <div class="video-source">
                    <span class="video-source-label"></span>
                    <span id="siteVideoCredit">—</span>
                </div>
            </div>
        </section>

        <!-- =====================================================
             CONTENU PRINCIPAL
             ===================================================== -->
        <section class="detail-content">

            <!-- =================================================
                 BON À SAVOIR
                 ================================================= -->
            <section class="detail-card">
                <h2>Good to know</h2>
                <ul id="siteFacts"></ul>
                <!-- Statistiques -->
                <div class="detail-stats">
                    <div><span>Category</span>
                        <strong id="siteCategory">—</strong>
                    </div>
                    <div>
                        <span>Difficulty</span>
                        <strong id="siteDifficulty">—</strong>
                    </div>
                    <div>
                        <span>Danger</span>
                        <strong id="siteDanger">—</strong>
                    </div>
                    <div>
                        <span> Estimated price</span>
                        <strong id="sitePrice">—</strong>
                    </div>
                </div>
            </section>

            <!-- =================================================
                 DESCRIPTION
                 ================================================= -->
            <section class="detail-card">
                <h2>Description</h2>
                <p id="siteDescription">
                    Description du lieu en cours de chargement.
                </p>
            </section>

            <!-- =================================================
                 CARTE
                 ================================================= -->
            <section class="detail-card detail-map-card">
                <div class="detail-card-head">
                    <h2>Navigation card</h2>
                    <span class="detail-tag">
                        Local view
                    </span>

                </div>
                <div id="miniMap" class="map-preview" aria-label="Carte de localisation du site"></div>
                <div class="detail-legend"></div>

            </section>
        </section>

    </main>

    <script src="js/i18n.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/mapicons.js"></script>
    <script src="js/site-detail.js"></script>

</body>

</html>
