<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site detail</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Work+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/site-detail.css">
    <link rel="stylesheet" href="css/map-markers.css">
</head>

<body class="page-shell">
    <div class="page-frame">
        <header class="detail-topbar">
            <a class="btn-ghost btn-back" href="sites.html">← Retour</a>
            <div class="detail-title-wrap">
                <h1 id="siteTitle">Chargement du lieu…</h1>
            </div>
            <div class="detail-topbar-actions">
                <button class="btn-solid" id="openItineraryBtn">Lancer l'itinéraire</button>
                <button class="btn-ghost btn-3d" id="launch3dBtn" type="button" disabled
                    title="Vue 3D — bientôt disponible (MapLibre GL JS)">
                    Vue 3D <span class="btn-soon">Bientôt</span>
                </button>
            </div>
        </header>

        <!-- ================= Hero vidéo plein cadre ================= -->
        <section class="detail-hero-frame">
            <div class="detail-video-frame">
                <video id="siteVideo" controls poster="">
                    <source id="videoSource" src="" type="video/mp4">
                    Votre navigateur ne supporte pas la vidéo.
                </video>

                <!-- Container for alternate video types (YouTube iframe / thumbnail) -->
                <div id="videoContainer" class="video-container" aria-hidden="true"></div>

                <!-- Overlay shown when autoplay is blocked or to present unmute control -->
                <div id="videoOverlay" class="video-overlay" aria-hidden="true">
                    <button id="playPreviewBtn" class="btn-ghost">Cliquer pour lancer la vidéo</button>
                </div>

                <!-- Unmute control (visible when playback is active but muted) -->
                <button id="unmuteBtn" class="btn-solid video-unmute" aria-pressed="false" hidden>Activer le
                    son</button>

                <!-- Chips flottants façon carrousel, posés directement sur la vidéo -->
                <div class="detail-hero-chips">
                    <span class="chip chip-active">Vidéo d'aperçu</span>
                    <span id="siteLocation" class="chip chip-ghost">Localisation en cours…</span>
                </div>
            </div>
        </section>

        <!-- ================= Citation éditoriale (générée depuis le bon à savoir) ================= -->
        <section class="detail-quote-band">
            <p id="siteCategory" class="detail-category-line">Catégorie</p>
            <p id="siteQuote" class="detail-quote">Chargement…</p>
            <p id="siteVideoCredit" class="detail-quote-credit"></p>
        </section>

        <!-- ================= Grille de cartes ================= -->
        <main class="detail-card-grid">
            <section class="detail-card">
                <div class="detail-card-head">
                    <span class="card-eyebrow">Bon à savoir</span>
                </div>
                <ul id="siteFacts" class="detail-facts"></ul>

                <div class="detail-stats detail-stats-divider">
                    <div>
                        <span class="detail-stat-label">Difficulté</span>
                        <strong id="siteDifficulty">—</strong>
                    </div>
                    <div>
                        <span class="detail-stat-label">Danger</span>
                        <strong id="siteDanger">—</strong>
                    </div>
                    <div>
                        <span class="detail-stat-label">Prix estimé</span>
                        <strong id="sitePrice">—</strong>
                    </div>
                </div>
            </section>

            <section class="detail-card">
                <div class="detail-card-head">
                    <span class="card-eyebrow">Description</span>
                </div>
                <p id="siteDescription" class="detail-description">Description du lieu en cours de chargement.</p>
            </section>

            <section class="detail-card detail-map-card">
                <div class="detail-card-head">
                    <span class="card-eyebrow">Carte de navigation</span>
                    <span class="detail-tag">Vue locale</span>
                </div>
                <!-- Rempli par Leaflet (voir initMiniMap() dans site-detail.js) -->
                <div id="miniMap" class="map-preview" aria-label="Carte de localisation du site"></div>
                <!-- Rempli dynamiquement par buildMiniMapLegend() dans site-detail.js -->
                <div class="detail-legend"></div>
            </section>
        </main>
    </div>

    <script src="js/i18n.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/mapicons.js"></script>
    <script src="js/site-detail.js"></script>
</body>

</html>
