<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="assets/images/logoLogin.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="itinerary.title">Itinerary</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Work+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/site.css">
    <link rel="stylesheet" href="css/map-markers.css">
    <link rel="stylesheet" href="css/itinerary.css">
</head>

<body class="itinerary-fullbleed">

    <!-- Carte plein écran, en fond de page -->
    <div id="routeMap" class="route-map-full" role="img" aria-label="Carte de l'itinéraire">

        <div class="float-topbar">
            <a class="fab fab-back" href="javascript:history.back()" aria-label="Back" data-tooltip="Back">
                <svg viewBox="0 0 24 24" fill="none" width="18" height="18" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M15 18l-6-6 6-6" />
                </svg>
            </a>

            <button type="button" class="fab fab-directions" id="openDirectionsBtn" aria-label="Itinéraire"
                data-tooltip="Get the itinerary">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <polygon points="3 11 22 2 13 21 11 13 3 11" />
                </svg>
            </button>

            <button type="button" class="fab fab-focus" id="focusOriginBtn" aria-label="Verrouiller le point de départ"
                data-tooltip="Lock the starting point">
                <!-- Les deux états (cadenas ouvert / fermé) sont dans le DOM en permanence ;
                     seul du CSS décide lequel est visible, en fonction de .route-map-full.is-locked
                     (classe déjà posée par itinerary.js). Plus besoin de réécrire un emoji en JS. -->
                <span id="focusOriginIcon" class="lock-icon">
                    <svg class="icon-unlocked" viewBox="0 0 24 24" width="17" height="17" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        aria-hidden="true">
                        <rect x="5" y="11" width="14" height="9" rx="2" />
                        <path d="M8 11V7a4 4 0 0 1 7.2-2.4" />
                    </svg>
                    <svg class="icon-locked" viewBox="0 0 24 24" width="17" height="17" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        aria-hidden="true">
                        <rect x="5" y="11" width="14" height="9" rx="2" />
                        <path d="M8 11V7a4 4 0 0 1 8 0v4" />
                    </svg>
                </span>
            </button>

            <button type="button" class="fab fab-yango" id="yangoBouton" aria-label="Commander un taxi Yango"
                data-tooltip="Order Yango taxi">
                <img src="assets/images/yango-logo.svg" alt="" width="18" height="18">
            </button>
        </div>

        <!-- Panneau "Obtenir l'itinéraire" -->
        <div class="directions-panel" id="directionsPanel">

            <button type="button" class="directions-close-btn" id="closeDirectionsPanel" aria-label="Fermer">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M18 6L6 18M6 6l12 12" />
                </svg>
            </button>

            <h2 id="itineraryTitle" class="directions-title">Itinéraire</h2>

            <!-- Champ 1 : recherche libre d'un lieu -->
            <div class="directions-field" id="placeSearchField">
                <svg class="field-icon" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="11" cy="11" r="7" />
                    <path d="M21 21l-4.3-4.3" />
                </svg>
                <input type="text" id="placeSearchInput" placeholder="Rechercher un lieu, une adresse…"
                    autocomplete="off" aria-label="Rechercher un lieu">
                <button type="button" class="search-clear-btn" id="placeSearchClearBtn"
                    aria-label="Effacer la recherche" hidden>
                    <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor"
                        stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 6L6 18M6 6l12 12" />
                    </svg>
                </button>
                <!-- Suggestions générées dynamiquement (ex: par itinerary.js) -->
                <ul class="search-results" id="placeSearchResults" hidden></ul>
            </div>

            <!-- Champs 2 et 3 : départ / destination, reliés par un petit rail -->
            <div class="directions-locations">
                <div class="directions-track" aria-hidden="true">
                    <span class="track-dot"></span>
                    <span class="track-line"></span>
                    <span class="track-pin"></span>
                </div>

                <div class="directions-locations-fields">
                    <div class="directions-field directions-field--plain">
                        <input type="text" id="departInput" placeholder="Point de départ" autocomplete="off">
                    </div>
                    <div class="directions-field directions-field--plain">
                        <input type="text" id="arriveeInput" placeholder="Destination" autocomplete="off">
                    </div>
                </div>

                <button type="button" class="directions-swap-btn" id="swapDirectionsBtn"
                    aria-label="Inverser départ et arrivée" data-tooltip="Swap">
                    <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M8 20V5M8 5L5 8M8 5l3 3" />
                        <path d="M16 4v15M16 19l3-3M16 19l-3-3" />
                    </svg>
                </button>
            </div>

            <!-- Modes de transport -->
            <div class="directions-modes">
                <button type="button" class="fab directions-mode-btn is-active" id="modeDriveBtn" aria-label="Voiture"
                    data-tooltip="Car">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
                        stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path
                            d="M4.5 16v-3.2c0-.4.14-.78.4-1.08l2-2.3a2 2 0 0 1 1.5-.67h7.2c.58 0 1.13.25 1.5.67l2 2.3c.26.3.4.68.4 1.08V16" />
                        <path d="M3.5 16h17" />
                        <path d="M7 9.5h10" />
                        <circle cx="7.5" cy="16" r="1.7" />
                        <circle cx="16.5" cy="16" r="1.7" />
                    </svg>
                </button>

                <button type="button" class="fab directions-mode-btn" id="modeWalkBtn" aria-label="Marche"
                    data-tooltip="Walk">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
                        stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="12.5" cy="4.5" r="1.8" />
                        <path d="M12.5 8v4.3" />
                        <path d="M12.5 8.8l3.2 2.1" />
                        <path d="M12.5 8.8l-2.4 2.6" />
                        <path d="M12.5 12.3l-2.3 6.7" />
                        <path d="M12.5 12.3l2.9 3 .6 3.7" />
                    </svg>
                </button>

                <button type="button" class="fab directions-mode-btn" id="modeBikeBtn" aria-label="Vélo"
                    data-tooltip="Bike">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
                        stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="6" cy="17" r="3.2" />
                        <circle cx="18" cy="17" r="3.2" />
                        <path d="M6 17l4.5-8h4" />
                        <path d="M10.5 9l3.3 8" />
                        <path d="M13.8 9h2.4l1.8 8" />
                        <path d="M9 6.3h2.3" />
                    </svg>
                </button>
            </div>
        </div>

        <!-- Résumé flottant du trajet, affiché seulement après calcul -->
        <div class="route-summary-float" id="routeSummaryFloat" hidden>
            <p id="routeSummary"></p>
        </div>

        <!-- Panneau "Lieux à proximité". Sur desktop il est toujours visible en bas à droite.
             Sur mobile, l'en-tête (icône + libellé) sert de poignée : il reste affiché en
             permanence à l'endroit même où la liste s'ouvre, au lieu d'un bouton rond isolé
             ailleurs sur l'écran. Les pastilles sont toujours générées dynamiquement par
             buildLegend() dans itinerary.js, à l'intérieur de #legendItems. -->
        <div class="legend-dock" id="legendDock">
            <button type="button" class="legend-header" id="legendToggleBtn" aria-expanded="false"
                aria-controls="legendItems" aria-label="Afficher les lieux à proximité"
                data-tooltip="Places nearby">
                <svg class="legend-header-icon" viewBox="0 0 24 24" width="16" height="16" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    aria-hidden="true">
                    <path d="M12 21s-7-6.5-7-11a7 7 0 0 1 14 0c0 4.5-7 11-7 11z" />
                    <circle cx="12" cy="10" r="2.5" />
                </svg>
                <span class="legend-header-label" data-i18n="itinerary.nearby">Lieux à proximité</span>
                <svg class="legend-chevron" viewBox="0 0 24 24" width="14" height="14" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    aria-hidden="true">
                    <path d="M6 9l6 6 6-6" />
                </svg>
            </button>

            <div class="detail-legend-float" id="legendItems"></div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/mapicons.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/itinerary.js"></script>
</body>

</html>
