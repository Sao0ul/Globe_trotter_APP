<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="assets/images/logoLogin.png" />
    <title>Connexion en cours...</title>
</head>

<body>
    <p>Connexion en cours, merci de patienter...</p>

    <script>
        const params = new URLSearchParams(window.location.search);
        const error = params.get('error');
        const token = params.get('token');
        const newUser = params.get('newUser') === 'true';

        if (error) {
            window.location.href = `/index.html?error=${encodeURIComponent(error)}`;
        } 
        else if (token) {
                localStorage.setItem('token', token);

                fetch('/api/users/me', { headers: { 'Authorization': `Bearer ${token}` } })
                    .then((res) => res.json())
                    .then((data) => {
                        localStorage.setItem('username', data.username);
                        window.location.href = newUser ? '/onboarding.html' : '/sites.html';
                    })
                    .catch(() => {
                        window.location.href = newUser ? '/onboarding.html' : '/sites.html';
                    });
            } else{
            window.location.href = '/index.html?error=missing_token';
        }
    </script>
</body>

</html>
