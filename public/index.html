<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="assets/images/logoLogin.png" />
    <title data-i18n="login.title">Discover Cameroon</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>


<body>
    <!-- ================= FOND VIDÉO OPTIMISÉ ================= -->
    <!-- L'attribut poster affiche une image WebP légère instantanément en attendant la vidéo -->
    <video autoplay loop muted playsinline preload="metadata" poster="assets/images/video_fallback.webp" class="bg-video">
        <!-- Le WebM est lu en premier par les navigateurs modernes (plus léger) -->
        <source src="assets/video/login_bg.webm" type="video/webm">
        <!-- Le MP4 sert uniquement de secours (fallback) pour les anciens navigateurs -->
        <source src="assets/video/login_bg.mp4" type="video/mp4">
    </video>
    <!-- Le voile sombre/overlay est placé juste ici pour filtrer visuellement la vidéo -->
    <div class="video-overlay"></div>


    <a href="policy.html"><i>Confidentiality policies</i></a>
   <!--====================== popup google ============================-->

    <div id="googleSuggestPopup" class="google-suggest-popup">
        <div class="google-suggest-content">
            <button type="button" class="google-suggest-close" aria-label="Fermer">&times;</button>
    
            <!-- Mascotte Émoji dynamique -->
            <div class="emoji-mascot">
                <span class="emoji-face">✌️</span>
                <span class="emoji-hand">😁</span>
            </div>
    
            <p>sign in or sign up easier with google</p>
    
            <button type="button" class="google-suggest-cta">
                Continue with google
            </button>
        </div>
    </div>

    <!-- ================= LANGUAGE SWITCHER ================= -->
    <div id="languageSwitcher" class="language-switcher">
        <button type="button" class="lang-pill" data-lang="fr">FR</button>
        <button type="button" class="lang-pill" data-lang="en">EN</button>
    </div>

    <!-- ================= LOGIN ================= -->
    <main class="login-container">
        <div class="login-card">

            <div class="logo">
                <div class="logo-circle">
                    <img src="./assets/images/logoLogin.png" alt="Discover Cameroon">
                </div>
                <h1 data-i18n="login.title">Discover Cameroon</h1>
                <p data-i18n="login.subtitle">Discover Cameroon's most beautiful landscapes, book tours, and enjoy an
                    unforgettable experience.</p>
            </div>

            <div id="errorMessage" class="error-message" hidden></div>

            <form id="loginForm">
                <div class="input-group">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="email" id="email" placeholder="Email address"
                        data-i18n-placeholder="login.emailPlaceholder" required>
                </div>

                <div class="input-group password-group">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="password" name="password" placeholder="Password"
                        data-i18n-placeholder="login.passwordPlaceholder" required>
                    <button type="button" id="togglePasswordBtn" class="password-toggle-btn"
                        aria-label="Afficher le mot de passe" aria-pressed="false">
                        <i class="fa-solid fa-eye"></i>
                    </button>
                </div>

                <div class="options">
                    <label>
                        <input type="checkbox">
                        <span data-i18n="login.rememberMe">Remember me</span>
                    </label>
                    <a href="#" data-i18n="login.forgotPassword">Forgot password?</a>
                </div>

                <button type="submit">
                    <i class="fa-solid fa-right-to-bracket"></i>
                    <span data-i18n="login.signIn">Sign in</span>
                </button>
            </form>

            <div class="separator"><span data-i18n="login.or">OR</span></div>

            <div class="social-buttons">
                <button class="social" id="google-btn" data-tooltip="Continue with Google">
                    <i class="fab fa-google"></i>
                </button>
                <button class="social" id="facebook-btn"><i class="fab fa-facebook-f"></i></button>
                <button class="social"><i class="fab fa-apple"></i></button>
            </div>

            <p class="register">
                <span data-i18n="login.noAccount">Don't have an account?</span>
                <a href="register.html" data-i18n="login.createAccount">Create account</a>
            </p>

        </div>
    </main>

    <script src="js/i18n.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/index.js"></script>
    <script src="js/popup.js"></script>

</body>

</html>
