<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/messages.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="messages-layout">
        <!-- Left Column: Search & Conversations -->
        <aside class="conversations-list" id="conversationsList">
            <div class="conversations-header">
                <h2>Messages</h2>
            </div>

            <div class="user-search">
                <i class="fa-solid fa-magnifying-glass search-icon"></i>
                <input type="text" id="userSearchInput" placeholder="Search user..." autocomplete="off">
                <ul id="userSearchResults"></ul>
            </div>

            <ul id="conversationsUl"></ul>
        </aside>

        <!-- Right Column: Active Chat Window -->
        <main class="chat-window">

            <div class="chat-header" id="chatHeader" style="display: none;">
                <div class="chat-header-info">
                    <h3 id="chatHeaderTitle">Conversation</h3>
                </div>
                <button type="button" id="callBtn" class="call-btn" aria-label="Appeler">
                    <i class="fa-solid fa-phone"></i>
                </button>
            </div>

            <div class="chat-messages" id="chatMessages"></div>

            <!--==================== VOICE CALLS ==========================================-->

            <div id="callModal" class="call-modal" style="display: none;">
                <div class="call-modal-content">
                    <div class="avatar-container">
                        <div id="callModalAvatar"></div>
                    </div>
                    <p id="callModalStatus">Appel en cours...</p>
                    <div class="call-modal-actions">
                        <button type="button" id="callAcceptBtn" class="call-accept-btn" style="display: none;">
                            <i class="fa-solid fa-phone"></i>
                        </button>
                        <button type="button" id="callRejectBtn" class="call-reject-btn">
                            <i class="fa-solid fa-phone-slash"></i>
                        </button>
                    </div>
                </div>
            </div>
            <audio id="remoteAudio" autoplay></audio>


            <!--====================options messagerie========================-->
            <form id="messageForm" class="chat-form">
                <label for="mediaInput" class="media-attach-btn" aria-label="Envoyer une image">
                    <i class="fa-solid fa-image"></i>
                </label>
                <input type="file" id="mediaInput" accept="image/jpeg,image/png,image/webp" hidden>
            
                <button type="button" id="voiceBtn" class="media-attach-btn" aria-label="Message vocal">
                    <i class="fa-solid fa-microphone"></i>
                </button>
            
                <input type="text" id="messageInput" placeholder="Write a message..." autocomplete="off" required>
                <button type="submit" aria-label="Send message">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </form>


        </main>
    </div>

    <script src="js/messages.js"></script>
    <script src="js/messages-media.js"></script>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="js/calls.js"></script>
</body>

</html>
